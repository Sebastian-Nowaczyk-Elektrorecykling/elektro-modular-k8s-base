apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: cilium-values
    valuesKey: values.yaml
