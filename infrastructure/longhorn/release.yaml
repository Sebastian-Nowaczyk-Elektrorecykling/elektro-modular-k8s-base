apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  releaseName: longhorn
  targetNamespace: longhorn-system
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: ${LONGHORN_REPLICAS}
      defaultDataPath: /var/lib/longhorn
      createDefaultDiskLabeledNodes: true
      defaultLonghornStaticStorageClass: longhorn
      storageMinimalAvailablePercentage: 15
    persistence:
      defaultClass: true
      defaultClassReplicaCount: ${LONGHORN_REPLICAS}
      reclaimPolicy: Retain
    longhornManager:
      nodeSelector:
        elektro.internal/workload: 'true'
    longhornDriver:
      nodeSelector:
        elektro.internal/workload: 'true'
    longhornUI:
      nodeSelector:
        elektro.internal/workload: 'true'
    ingress:
      enabled: false
