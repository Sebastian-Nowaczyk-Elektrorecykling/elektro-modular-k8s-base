apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  timeout: 15m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    nodeSelector:
      elektro.internal/workload: 'true'
    webhook:
      nodeSelector:
        elektro.internal/workload: 'true'
    cainjector:
      nodeSelector:
        elektro.internal/workload: 'true'
