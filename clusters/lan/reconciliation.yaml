apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/namespaces
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: cluster
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
---
