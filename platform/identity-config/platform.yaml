version: 1
metadata:
  name: Elektro platform access
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_core.group
    id: longhorn-users
    identifiers: {name: service-longhorn}
  - model: authentik_core.group
    id: hubble-users
    identifiers: {name: service-hubble}
  - model: authentik_providers_proxy.proxyprovider
    id: longhorn-provider
    identifiers: {name: longhorn}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: https://longhorn.admin.internal
      internal_host: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
      access_token_validity: minutes=5
  - model: authentik_providers_proxy.proxyprovider
    id: hubble-provider
    identifiers: {name: hubble}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: https://hubble.admin.internal
      internal_host: http://hubble-ui.kube-system.svc.cluster.local:80
      access_token_validity: minutes=5
  - model: authentik_core.application
    id: longhorn-app
    identifiers: {slug: longhorn}
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
      policy_engine_mode: all
  - model: authentik_core.application
    id: hubble-app
    identifiers: {slug: hubble}
    attrs:
      name: Hubble
      provider: !KeyOf hubble-provider
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf longhorn-app
      group: !KeyOf longhorn-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hubble-app
      group: !KeyOf hubble-users
      order: 0
  - model: authentik_outposts.outpost
    identifiers: {name: authentik Embedded Outpost}
    attrs:
      type: proxy
      providers: [!KeyOf longhorn-provider, !KeyOf hubble-provider]
      config:
        authentik_host: https://auth.admin.internal
        authentik_host_browser: https://auth.admin.internal
        refresh_interval: minutes=1
