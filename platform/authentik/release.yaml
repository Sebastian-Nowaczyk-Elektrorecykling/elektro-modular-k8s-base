apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: identity
spec:
  interval: 30m
  releaseName: authentik
  targetNamespace: identity
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: 2026.8.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      nodeSelector:
        elektro.internal/workload: 'true'
      envFrom:
      - secretRef:
          name: authentik-secrets
      env:
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: password
      - name: AUTHENTIK_POSTGRESQL__SSLMODE
        value: verify-full
      - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
        value: /db-ca/ca.crt
      volumes:
      - name: db-ca
        secret:
          secretName: authentik-db-ca
      volumeMounts:
      - name: db-ca
        mountPath: /db-ca
        readOnly: true
    authentik:
      postgresql:
        host: authentik-db-rw.identity.svc.cluster.local
        name: authentik
        user: authentik
      error_reporting:
        enabled: false
    postgresql:
      enabled: false
    serviceAccount:
      create: false
    server:
      replicas: ${PLATFORM_REPLICAS}
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
    blueprints:
      configMaps:
      - platform-blueprints
