apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: identity
spec:
  parentRefs:
  - name: internal
    namespace: networking
    sectionName: https
  hostnames:
  - auth.admin.internal
  rules:
  - backendRefs:
    - name: authentik-server
      port: 80
---
