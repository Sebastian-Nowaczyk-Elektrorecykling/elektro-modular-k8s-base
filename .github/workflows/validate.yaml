name: Validate cluster base
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck
          bash scripts/ci-tools.sh
      - name: Offline invariants, shell checks and negative authorization tests
        run: make validate test
      - name: Render all Kustomize stages and pinned Helm charts
        run: |
          export PATH="$PWD/.local/bin:$PATH"
          make render
  identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test real provider configuration and authorization model
        run: bash scripts/ci-identity.sh
